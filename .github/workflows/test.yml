name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # test/index.test.mjs verifies that the commit pinned in
          # plugin-index.json is in this history.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The bundle has no dependencies and no build step.
      - run: npm run check
      - run: npm test
